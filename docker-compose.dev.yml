version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5400:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - fasqon_net

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fasqon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fasqon_net

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    networks:
      - fasqon_net

networks:
  fasqon_net:
    driver: bridge

volumes:
  postgres_data:
